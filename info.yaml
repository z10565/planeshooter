# Tiny Tapeout project information
project:
  title: "PlaneShooter"
  author: "Zarina"
  discord: ""  # Optional; provide your Discord handle if wanted
  description: "Motion-control-ready airplane shooter game with VGA video output"
  language: "Verilog"
  clock_hz: 25000000
  # WARNING: 1x2 means 2 physical tiles, NOT 3. Verify allocation and fit.
  # Standard Tiny Tapeout rectangular options include 1x1, 1x2, 2x2, 3x2.
  tiles: "1x2"
  top_module: "tt_um_z10565_skypilot"
  source_files:
    - "skypilot_all_in_one.v"
pinout:
  # Current VULKOS_BUTTON_MODE = 1 in the Verilog source.
  # The phone-tilt mode is not enabled until that parameter is changed.
  ui[0]: "LEFT button"
  ui[1]: "RIGHT button"
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: "RESTART button"
  ui[7]: "FIRE button"
  # Tiny VGA Pmod outputs
  uo[0]: "Red bit 1"
  uo[1]: "Green bit 1"
  uo[2]: "Blue bit 1"
  uo[3]: "VGA VSYNC"
  uo[4]: "Red bit 0"
  uo[5]: "Green bit 0"
  uo[6]: "Blue bit 0"
  uo[7]: "VGA HSYNC"
  # Currently unused; all bidirectional pins are configured as inputs
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""
# Do not change!
yaml_version: 6
